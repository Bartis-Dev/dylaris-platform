# ─────────────────────────────────────────────────────────────────────────────
# DYLARIS — SINGLE-HOST deployment
#
# Everything runs on ONE machine over a local bridge network.
# Best for a single VPS / homelab box.
#
#   cp .env.example .env   # then edit JWT_SECRET, CLUSTER_SECRET, DB_PASSWORD
#   docker compose up -d
#   open http://localhost:25510  →  /setup
#
# For a multi-host fleet, use docker-stack.yml (Docker Swarm) instead.
# ─────────────────────────────────────────────────────────────────────────────

services:
  core:
    image: ghcr.io/bartis-dev/dylaris-platform-core:latest
    restart: unless-stopped
    depends_on:
      timescaledb:
        condition: service_healthy
      redis:
        condition: service_started
    environment:
      API_PORT: "25500"
      FRONTEND_URL: "http://panel:25510"
      JWT_SECRET: "${JWT_SECRET}"
      CLUSTER_SECRET: "${CLUSTER_SECRET}"
      DYLARIS_REGION: "${DYLARIS_REGION:-default}"
      DB_HOST: timescaledb
      DB_PORT: "5432"
      DB_USER: "${DB_USER}"
      DB_PASSWORD: "${DB_PASSWORD}"
      DB_NAME: "${DB_NAME}"
      REDIS_ADDR: "redis:6379"
      # Core admin Redis login. Empty against the bundled passwordless dev Valkey;
      # for a password-protected or external Redis set both. REDIS_PASSWORD supports
      # the _FILE secret convention (REDIS_PASSWORD_FILE=...). Scoped per-node users
      # are always Core-provisioned, never hand-set.
      REDIS_USER: "${REDIS_USER:-}"
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    ports:
      - "25500:25500"   # REST API
      - "25501:25501"   # gRPC node mesh (Cluster-Sync)
    networks:
      - dylaris_net

  node:
    image: ghcr.io/bartis-dev/dylaris-platform-node:latest
    restart: unless-stopped
    depends_on:
      - redis
    environment:
      NODE_ID: "${NODE_ID:-node-01}"
      CLUSTER_SECRET: "${CLUSTER_SECRET}"
      NODE_TAGS: "${NODE_TAGS:-}"
      NODE_REGION: "${NODE_REGION:-}"
      REDIS_ADDR: "redis:6379"
      PORT_RANGE_START: "${PORT_RANGE_START:-25600}"
      PORT_RANGE_END: "${PORT_RANGE_END:-30000}"
      # Comma-separated hosts the Node may download Core-minted pack mrpacks
      # from, e.g. app.example.com
      MODPACK_MIRROR_HOSTS: "${MODPACK_MIRROR_HOSTS:-}"
    volumes:
      # The Node drives the host Docker daemon to launch MC server containers.
      - /var/run/docker.sock:/var/run/docker.sock
      - dylaris_data:/app/dylaris_data
    # MC server host ports (ip_port / both routing modes) are published from the
    # container by the Node. Expose the configured range on the host:
    ports:
      - "25600-30000:25600-30000"
      - "25520:25520"   # SFTP (when file access = sftp/both)
    networks:
      - dylaris_net

  panel:
    image: ghcr.io/bartis-dev/dylaris-platform-panel:latest
    restart: unless-stopped
    environment:
      # Browser-reachable Core API URL (NOT the internal service name).
      NEXT_PUBLIC_API_URL: "${PANEL_API_URL:-http://localhost:25500}"
    ports:
      - "25510:25510"
    networks:
      - dylaris_net

  timescaledb:
    image: timescale/timescaledb:latest-pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: "${DB_USER}"
      POSTGRES_PASSWORD: "${DB_PASSWORD}"
      POSTGRES_DB: "${DB_NAME}"
    volumes:
      - timescaledb_data:/var/lib/postgresql/data
    healthcheck:
      # $$ escapes compose interpolation so the container shell expands
      # POSTGRES_USER/DB from its own environment.
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    networks:
      - dylaris_net

  redis:
    # Valkey - a drop-in, Redis-compatible fork. Service name stays "redis"
    # so REDIS_ADDR=redis:6379 works everywhere. In-memory only (coordination
    # bus, not the source of truth - Postgres is).
    # Redis ACL is mandatory. The entrypoint below seeds the aclfile on first boot
    # with an admin `default` user whose password is REDIS_PASSWORD, so Valkey comes
    # up already locked (no open window). Empty REDIS_PASSWORD seeds a PASSWORDLESS
    # admin for local dev; PRODUCTION MUST set REDIS_PASSWORD (equal to Core's).
    # Core then provisions the per-node scoped users. Mount the PARENT DIRECTORY
    # (ACL SAVE does temp-file + rename). See docs/superpowers/redis-acl-deploy.md.
    image: valkey/valkey:8-alpine
    restart: unless-stopped
    environment:
      REDIS_PASSWORD: "${REDIS_PASSWORD:-}"
    # Seed users.acl if absent, then exec valkey-server with the SAME flags. $$
    # escapes compose interpolation so the container shell expands the vars.
    entrypoint:
      - /bin/sh
      - -c
      - |
        set -e
        ACL=/etc/valkey/users.acl
        if [ ! -s "$$ACL" ]; then
          if [ -n "$$REDIS_PASSWORD" ]; then
            echo "user default on >$$REDIS_PASSWORD ~* &* +@all" > "$$ACL"
          else
            echo "redisacl: WARNING seeding a PASSWORDLESS admin default (dev only; production MUST set REDIS_PASSWORD)" >&2
            echo "user default on nopass ~* &* +@all" > "$$ACL"
          fi
        fi
        exec valkey-server --save "" --appendonly no --aclfile "$$ACL"
    volumes:
      - ./valkey-acl:/etc/valkey
    networks:
      - dylaris_net

volumes:
  timescaledb_data:
  dylaris_data:

networks:
  dylaris_net:
    driver: bridge
