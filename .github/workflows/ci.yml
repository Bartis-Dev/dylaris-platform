name: CI — Build & Push

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all services (ignore change detection)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bartis-dev/dylaris-platform

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      core: ${{ steps.filter.outputs.core }}
      node: ${{ steps.filter.outputs.node }}
      panel: ${{ steps.filter.outputs.panel }}
      log-shipper: ${{ steps.filter.outputs.log-shipper }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
              - 'proto/**'
              - 'pkg/**'
            node:
              - 'node/**'
              - 'proto/**'
              - 'pkg/**'
            panel:
              - 'panel/**'
            log-shipper:
              - 'log-shipper/**'
              - 'docker/mc-server/**'

  # ──────────────────────────────────────────────
  # Core
  # ──────────────────────────────────────────────
  build-core:
    needs: detect-changes
    if: needs.detect-changes.outputs.core == 'true' || inputs.build_all == true
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core:${{ steps.tags.outputs.TAG_SHA }}
          build-args: |
            ENTRY_PATH=./core/

  # ──────────────────────────────────────────────
  # Node, Panel, Log-Shipper
  # ──────────────────────────────────────────────
  build-node:
    needs: detect-changes
    if: needs.detect-changes.outputs.node == 'true' || inputs.build_all == true
    uses: ./.github/workflows/build-service.yml
    with:
      component: node
      entry_path: ./node/
      extra_build_args: "INSTALL_QUOTA=1"
    secrets: inherit

  build-panel:
    needs: detect-changes
    if: needs.detect-changes.outputs.panel == 'true' || inputs.build_all == true
    uses: ./.github/workflows/build-service.yml
    with:
      component: panel
      dockerfile: ./panel/Dockerfile
      context: .
      # Owner's published image keeps its baked SaaS URL (the ARG now defaults
      # to empty for a self-hoster's own build).
      extra_build_args: "NEXT_PUBLIC_API_URL=https://api.dylaris.com/api"
    secrets: inherit

  build-log-shipper:
    needs: detect-changes
    if: needs.detect-changes.outputs.log-shipper == 'true' || inputs.build_all == true
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: log-shipper/go.sum

      - name: Build log-shipper binary
        run: |
          chmod +x ./build_shipper.sh
          ./build_shipper.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push java21
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java21
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java21:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java21:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java17
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java17
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java17:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java17:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java8
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java8
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java8:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java8:${{ steps.tags.outputs.TAG_SHA }}
