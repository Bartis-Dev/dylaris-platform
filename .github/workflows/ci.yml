name: CI

# One workflow, one run per push. Order of operations:
#   1. Run the FULL test suite first (every Go module + the panel).
#   2. Only if everything is green, run change detection.
#   3. Build and push the images whose paths changed.
# On pull_request only the tests run (no image build/push). A manual
# workflow_dispatch runs the tests and then builds EVERY image (full rebuild),
# regardless of what changed.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bartis-dev/dylaris-platform

jobs:
  # ----------------------------------------------
  # 1. Tests - always run first, for every module.
  # ----------------------------------------------
  go-tests:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        module: [core, node, pkg, log-shipper, beam/app]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # beam/app embeds frontend/dist (a Wails build artifact that a fresh
      # checkout does not have, so `go build` fails on the //go:embed). The Go
      # tests use fakes and never read the real bundle, so a one-file stub is
      # enough to satisfy the embed and compile. The real frontend is built for
      # release in beam-release.yml.
      - name: Stub beam frontend bundle
        if: matrix.module == 'beam/app'
        working-directory: ${{ matrix.module }}
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>stub</title>' > frontend/dist/index.html

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # staticcheck correctness gate (pinned). Runs the SA (correctness) checks
      # only; the ST/S1/U/QF style families are intentionally not enforced.
      # Three SA checks are excluded as pre-existing, deliberately-deferred
      # findings so the gate stays green and meaningful for NEW code:
      #   SA1019 - deprecated APIs still in use (go-redis SetNX, aws uploader,
      #            tar.TypeRegA); tracked, not a correctness bug.
      #   SA1029 - built-in string context keys; a codebase-wide pattern set by
      #            the auth middleware, a broad refactor tracked separately.
      #   SA9003 - two pre-existing empty branches in handlers/tickets.go.
      # `go run ...@version` pins the tool and does not modify go.mod/go.sum.
      - name: staticcheck
        working-directory: ${{ matrix.module }}
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks 'SA*,-SA1019,-SA1029,-SA9003' ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

  # Race detector gate. Separate from go-tests because it needs a C toolchain
  # that the plain matrix does not: -race requires cgo, and cgo requires gcc,
  # which is not installed on this runner and is not ours to add.
  #
  # Runs as a docker BUILD, which uploads its context instead of mounting one.
  # That is the same code path the image-build jobs below have always used
  # successfully here, so it does not depend on how the runner itself is
  # packaged. Two simpler mechanisms were tried first and both failed for
  # environment reasons; .github/race.Dockerfile records what they were so
  # nobody spends the afternoon rediscovering them.
  #
  # Covers EVERY Go module. It started core-only ON PURPOSE, because a NEW gate
  # that retroactively fails on untouched code blocks deploys for reasons nobody
  # chose that day, and the rule was to extend it per module only once that
  # module had been read by hand. All four others were checked on 2026-08-02/03:
  # the checks found two races in node and a dead-letter data-loss path in pkg
  # (all fixed and covered before the gate moved), and found log-shipper and
  # beam/app already correct. The rule has now been applied everywhere, so a new
  # module is the only thing that should ever need adding here again.
  #
  # See .github/race.Dockerfile for what a green run here does and does not prove.
  race-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # BUILDKIT_PROGRESS=plain so the test output lands in the job log. Without
      # it buildx collapses the RUN and a PASSING run tells you nothing about
      # what actually ran; a gate you cannot read is a gate you stop trusting.
      - name: go test -race (all Go modules)
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./.github/race.Dockerfile
          push: false

  # Postgres integration gate. Every other test in this repo runs against fakes,
  # which is exactly why a run of SQL defects shipped unnoticed: the statements
  # were only ever rejected by a real Postgres.
  #
  #   ticket status / user role   inconsistent types deduced for parameter $1
  #   ticket_messages.user_id     NOT NULL with ON DELETE SET NULL -> 23502
  #   backup_jobs.*_patterns      nil slice into a NOT NULL text[] -> 23502
  #   spark_profiles.requested_by UUID scanned into an integer target
  #
  # Plain postgres, not timescaledb: DBType "postgres" makes ensureSchema create
  # server_stats as an ordinary table, so no extension is needed here.
  #
  # NOT yet listed in any `needs:`. This job has never run on this runner, and
  # a NEW gate that fails for environment reasons blocks deploys for reasons
  # nobody chose that day - the same rule the race-tests comment above records.
  # Once it has been green once, add it to detect-changes and to the build jobs
  # so it gates like every other test job.
  db-tests:
    runs-on: self-hosted
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: dylaris
          POSTGRES_PASSWORD: testpw
          POSTGRES_DB: dylaris_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: core/go.sum

      # The suite skips itself when DYLARIS_TEST_DB_HOST is unset, so this is
      # also the switch that turns it on: `go test ./...` stays green on a
      # machine without a database.
      - name: go test (Postgres integration)
        working-directory: core
        env:
          # 127.0.0.1, not localhost: the runner resolves localhost to ::1 first
          # and the service container publishes on IPv4 only, so every connection
          # was refused - InitDB then retried for two minutes per test before the
          # job finally failed.
          DYLARIS_TEST_DB_HOST: 127.0.0.1
          DYLARIS_TEST_DB_PORT: '5432'
          DYLARIS_TEST_DB_USER: dylaris
          DYLARIS_TEST_DB_PASSWORD: testpw
          DYLARIS_TEST_DB_NAME: dylaris_test
        run: go test -count=1 -v -run Integration ./database/

  panel-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # This is an npm workspaces monorepo (root package.json declares
      # "workspaces": ["packages/*", "panel"]) and the lockfile lives at the
      # repo root, not panel/package-lock.json. `npm ci` is intentionally not
      # used here: panel/Dockerfile documents that this lockfile was generated
      # on Windows and misses platform-specific optional native binaries
      # (lightningcss/swc) for other OS/libc targets, so it does a plain
      # `npm install --workspaces --include-workspace-root` instead. Mirrored
      # here for the same reason.
      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Run vitest
        working-directory: panel
        run: npx vitest run

  # ----------------------------------------------
  # 2. Change detection - only after every test job is green, and never on PRs.
  # ----------------------------------------------
  detect-changes:
    needs: [go-tests, race-tests, panel-tests]
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    outputs:
      core: ${{ steps.filter.outputs.core }}
      node: ${{ steps.filter.outputs.node }}
      panel: ${{ steps.filter.outputs.panel }}
      log-shipper: ${{ steps.filter.outputs.log-shipper }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
              - 'proto/**'
              - 'pkg/**'
            node:
              - 'node/**'
              - 'proto/**'
              - 'pkg/**'
            panel:
              - 'panel/**'
            log-shipper:
              - 'log-shipper/**'
              - 'docker/mc-server/**'

  # ----------------------------------------------
  # 3. Build + push. Changed images on push; every image on workflow_dispatch.
  # ----------------------------------------------
  build-core:
    needs: [go-tests, race-tests, panel-tests, detect-changes]
    if: needs.detect-changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      # Per-job Docker credential store; see the same step in
      # build-service.yml for why a shared ~/.docker/config.json on a
      # concurrent self-hosted runner produces a 403 on push.
      - name: Isolate Docker credentials for this job
        run: |
          DIR="${RUNNER_TEMP}/docker-${{ github.run_id }}-core"
          mkdir -p "$DIR"
          echo "DOCKER_CONFIG=$DIR" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core:${{ steps.tags.outputs.TAG_SHA }}
          build-args: |
            ENTRY_PATH=./core/
            SERVICE=core
            RUN_AS=dylaris

  build-node:
    needs: [go-tests, race-tests, panel-tests, detect-changes]
    if: needs.detect-changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-service.yml
    with:
      component: node
      entry_path: ./node/
      extra_build_args: "INSTALL_QUOTA=1"
    secrets: inherit

  build-panel:
    needs: [go-tests, race-tests, panel-tests, detect-changes]
    if: needs.detect-changes.outputs.panel == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-service.yml
    with:
      component: panel
      dockerfile: ./panel/Dockerfile
      context: .
      # No baked API URL: NEXT_PUBLIC_API_URL stays empty so the published image
      # resolves the Core API same-origin (/api) by default and never falls back
      # to a vendor host. EVERY deployment - hosted included - points the panel at
      # its Core by setting PANEL_API_URL at runtime (config.js shim), which also
      # drives the CSP connect-src. Empty PANEL_API_URL = same-origin, so a
      # self-hoster reaching the panel over localhost / a LAN IP just works.
    secrets: inherit

  build-log-shipper:
    needs: [go-tests, race-tests, panel-tests, detect-changes]
    if: needs.detect-changes.outputs.log-shipper == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      # Per-job Docker credential store; see the same step in
      # build-service.yml for why a shared ~/.docker/config.json on a
      # concurrent self-hosted runner produces a 403 on push.
      - name: Isolate Docker credentials for this job
        run: |
          DIR="${RUNNER_TEMP}/docker-${{ github.run_id }}-log-shipper"
          mkdir -p "$DIR"
          echo "DOCKER_CONFIG=$DIR" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: log-shipper/go.sum

      - name: Build log-shipper binary
        run: |
          chmod +x ./build_shipper.sh
          ./build_shipper.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi

      # Minecraft 26.1+ refuses to start on anything below Java 25 ("Minecraft
      # 26.1 and newer requires running the server with Java 25 or above"), and
      # the version pickers offer 26.x, so without this image the newest
      # selectable version installs a server that can never boot.
      - name: Build and push java25
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java25
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java25:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java25:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java21
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java21
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java21:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java21:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java17
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java17
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java17:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java17:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java8
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java8
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java8:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java8:${{ steps.tags.outputs.TAG_SHA }}
