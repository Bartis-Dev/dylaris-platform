name: CI

# One workflow, one run per push. Order of operations:
#   1. Run the FULL test suite first (every Go module + the panel).
#   2. Only if everything is green, run change detection.
#   3. Build and push the images whose paths changed.
# On pull_request only the tests run (no image build/push). A manual
# workflow_dispatch runs the tests and then builds EVERY image (full rebuild),
# regardless of what changed.

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bartis-dev/dylaris-platform

jobs:
  # ----------------------------------------------
  # 1. Tests - always run first, for every module.
  # ----------------------------------------------
  go-tests:
    runs-on: self-hosted
    strategy:
      fail-fast: false
      matrix:
        module: [core, node, pkg, log-shipper, beam/app]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: ${{ matrix.module }}/go.sum

      # beam/app embeds frontend/dist (a Wails build artifact that a fresh
      # checkout does not have, so `go build` fails on the //go:embed). The Go
      # tests use fakes and never read the real bundle, so a one-file stub is
      # enough to satisfy the embed and compile. The real frontend is built for
      # release in beam-release.yml.
      - name: Stub beam frontend bundle
        if: matrix.module == 'beam/app'
        working-directory: ${{ matrix.module }}
        run: |
          mkdir -p frontend/dist
          printf '<!doctype html><title>stub</title>' > frontend/dist/index.html

      - name: go build
        working-directory: ${{ matrix.module }}
        run: go build ./...

      - name: go vet
        working-directory: ${{ matrix.module }}
        run: go vet ./...

      # gofmt gate. Formatting drifts on its own: 38 files across four modules
      # had drifted before this existed, because build, vet, test and
      # staticcheck all pass happily on unformatted code and nothing else was
      # looking.
      #
      # -l lists files differing from gofmt's output; a non-empty list fails the
      # job and prints the diff, so the fix is one `gofmt -w` away. The vendored
      # Wails tree is excluded - it is a third-party snapshot carried on purpose
      # (beam/app/VENDOR.md) and is not ours to reformat.
      - name: gofmt
        working-directory: ${{ matrix.module }}
        run: |
          unformatted=$(gofmt -l . | grep -v '^third_party/' || true)
          if [ -n "$unformatted" ]; then
            echo "These files are not gofmt-clean:"
            echo "$unformatted"
            echo
            gofmt -d $unformatted
            exit 1
          fi

      # staticcheck correctness gate (pinned). Runs the SA (correctness) checks
      # plus U1000; the ST/S1/QF style families are intentionally not enforced.
      #
      # U1000 (unused) is here because dead code is not a style question in this
      # tree - it is how a feature silently fails to exist. customDomainDeadlineHint
      # was written to be the one place two route handlers agreed on what they
      # promised the customer, and had NO caller, so neither handler promised
      # anything and a route on an unproven domain vanished four hours later with
      # no warning. Nothing failed; the code was simply never reached. Deliberate
      # exceptions take //lint:ignore U1000 with a reason, which is the point.
      #
      # Three SA checks are excluded as pre-existing, deliberately-deferred
      # findings so the gate stays green and meaningful for NEW code:
      #   SA1019 - deprecated APIs still in use (go-redis SetNX, aws uploader,
      #            tar.TypeRegA); tracked, not a correctness bug.
      #   SA1029 - built-in string context keys; a codebase-wide pattern set by
      #            the auth middleware, a broad refactor tracked separately.
      #   SA9003 - two pre-existing empty branches in handlers/tickets.go.
      # `go run ...@version` pins the tool and does not modify go.mod/go.sum.
      - name: staticcheck
        working-directory: ${{ matrix.module }}
        run: go run honnef.co/go/tools/cmd/staticcheck@v0.7.0 -checks 'SA*,U1000,-SA1019,-SA1029,-SA9003' ./...

      - name: go test
        working-directory: ${{ matrix.module }}
        run: go test -count=1 ./...

      # Reachability-based vulnerability gate.
      #
      # This is the check that catches what Dependabot structurally cannot.
      # Dependabot reads manifests; the Go toolchain is pinned in this workflow
      # and in the Dockerfiles, so it sat on 1.26.1 with standard-library
      # vulnerabilities reachable from every service's own code and nothing
      # said a word. govulncheck traces from this module's code to the
      # vulnerable SYMBOL, so it also does not cry about a dependency whose
      # vulnerable function nobody here calls.
      #
      # Exit 3 is "vulnerabilities found", which is data, not a tool failure -
      # the gate below decides what it means. Any other non-zero exit IS a tool
      # failure and stops the job, because a scanner that silently did not run
      # is worse than no scanner.
      #
      # A note for the day this fires on beam/app: its Wails is VENDORED and
      # security-patched on purpose (beam/app/VENDOR.md), so the answer there is
      # to patch the vendored tree, never to bump it to a stock release.
      #
      # See .github/vulngate.awk for the fail-vs-report rule.
      - name: govulncheck
        working-directory: ${{ matrix.module }}
        run: |
          # Installed rather than `go run ...@version` like staticcheck above,
          # and that is not a style choice: `go run` reports the tool's exit
          # status as its own 1, so "found vulnerabilities" (3) and "the scanner
          # broke" would arrive identical here. Running the binary keeps them
          # apart, which is the whole basis of the check below.
          go install golang.org/x/vuln/cmd/govulncheck@v1.7.0
          code=0
          "$(go env GOPATH)/bin/govulncheck" ./... > "$RUNNER_TEMP/vulns.txt" || code=$?
          if [ "$code" -ne 0 ] && [ "$code" -ne 3 ]; then
            cat "$RUNNER_TEMP/vulns.txt"
            echo "govulncheck itself failed (exit $code)"
            exit "$code"
          fi
          cat "$RUNNER_TEMP/vulns.txt"
          echo "--- reachability gate ---"
          awk -f "$GITHUB_WORKSPACE/.github/vulngate.awk" "$RUNNER_TEMP/vulns.txt"

  # Race detector gate. Separate from go-tests because it needs a C toolchain
  # that the plain matrix does not: -race requires cgo, and cgo requires gcc,
  # which is not installed on this runner and is not ours to add.
  #
  # Runs as a docker BUILD, which uploads its context instead of mounting one.
  # That is the same code path the image-build jobs below have always used
  # successfully here, so it does not depend on how the runner itself is
  # packaged. Two simpler mechanisms were tried first and both failed for
  # environment reasons; .github/race.Dockerfile records what they were so
  # nobody spends the afternoon rediscovering them.
  #
  # Covers EVERY Go module. It started core-only ON PURPOSE, because a NEW gate
  # that retroactively fails on untouched code blocks deploys for reasons nobody
  # chose that day, and the rule was to extend it per module only once that
  # module had been read by hand. All four others were checked on 2026-08-02/03:
  # the checks found two races in node and a dead-letter data-loss path in pkg
  # (all fixed and covered before the gate moved), and found log-shipper and
  # beam/app already correct. The rule has now been applied everywhere, so a new
  # module is the only thing that should ever need adding here again.
  #
  # See .github/race.Dockerfile for what a green run here does and does not prove.
  race-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      # BUILDKIT_PROGRESS=plain so the test output lands in the job log. Without
      # it buildx collapses the RUN and a PASSING run tells you nothing about
      # what actually ran; a gate you cannot read is a gate you stop trusting.
      - name: go test -race (all Go modules)
        uses: docker/build-push-action@v5
        env:
          BUILDKIT_PROGRESS: plain
        with:
          context: .
          file: ./.github/race.Dockerfile
          push: false

  # Postgres integration gate. Every other test in this repo runs against fakes,
  # which is exactly why a run of SQL defects shipped unnoticed: the statements
  # were only ever rejected by a real Postgres.
  #
  #   ticket status / user role   inconsistent types deduced for parameter $1
  #   ticket_messages.user_id     NOT NULL with ON DELETE SET NULL -> 23502
  #   backup_jobs.*_patterns      nil slice into a NOT NULL text[] -> 23502
  #   spark_profiles.requested_by UUID scanned into an integer target
  #   modversions.modrinth_download_url  missing on every fresh install
  #
  # NOT a `services:` block, and not for want of trying: two runs proved one
  # does start a healthy Postgres here and that the job still cannot reach it,
  # over localhost and 127.0.0.1 alike. THIS RUNNER IS ITSELF CONTAINERIZED
  # (race.Dockerfile records the same fact), so `-p` publishes on the host
  # daemon, outside the runner's network namespace. Two containers on one
  # user-defined network reach each other by NAME instead, which needs neither.
  #
  # See .github/db.Dockerfile for why the tests are baked into an image rather
  # than mounted, and why they run as `docker run` rather than as a build step.
  #
  # It gates the builds like every other test job. It was deliberately kept out
  # of `needs:` until it had been green once - a new gate that fails for
  # environment reasons blocks deploys for reasons nobody chose that day, which
  # is the rule the race-tests comment above records. That happened on run
  # 31158973711: 6/6 against a real Postgres, 357 statements prepared.
  db-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: go test against a real Postgres
        run: |
          set -eu
          NET="dyl-dbtest-${{ github.run_id }}"
          PG="dyl-pg-${{ github.run_id }}"
          IMG="dyl-dbtest:${{ github.run_id }}"

          cleanup() {
            docker rm -f "$PG" >/dev/null 2>&1 || true
            docker network rm "$NET" >/dev/null 2>&1 || true
            docker image rm -f "$IMG" >/dev/null 2>&1 || true
          }
          trap cleanup EXIT

          docker network create "$NET"
          docker run -d --name "$PG" --network "$NET"             -e POSTGRES_USER=dylaris -e POSTGRES_PASSWORD=testpw -e POSTGRES_DB=dylaris_test             --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 20             postgres:16-alpine

          # Wait on the container's own healthcheck. Bounded at ~90s: the image
          # is small and already local, so anything slower is a real failure and
          # should say so quickly rather than let InitDB retry for minutes.
          for _ in $(seq 1 45); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' "$PG")" = healthy ] && break
            sleep 2
          done
          if [ "$(docker inspect -f '{{.State.Health.Status}}' "$PG")" != healthy ]; then
            echo "::error::postgres never became healthy"
            docker logs "$PG" | tail -30
            exit 1
          fi

          docker build -f .github/db.Dockerfile -t "$IMG" .

          # DYLARIS_TEST_DB_HOST is also the switch that turns the suite on: it
          # skips itself when unset, so `go test ./...` stays green anywhere
          # without a database.
          docker run --rm --network "$NET"             -e DYLARIS_TEST_DB_HOST="$PG"             -e DYLARIS_TEST_DB_PORT=5432             -e DYLARIS_TEST_DB_USER=dylaris             -e DYLARIS_TEST_DB_PASSWORD=testpw             -e DYLARIS_TEST_DB_NAME=dylaris_test             "$IMG"

  panel-tests:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'
          cache-dependency-path: package-lock.json

      # This is an npm workspaces monorepo (root package.json declares
      # "workspaces": ["packages/*", "panel"]) and the lockfile lives at the
      # repo root, not panel/package-lock.json. `npm ci` is intentionally not
      # used here: panel/Dockerfile documents that this lockfile was generated
      # on Windows and misses platform-specific optional native binaries
      # (lightningcss/swc) for other OS/libc targets, so it does a plain
      # `npm install --workspaces --include-workspace-root` instead. Mirrored
      # here for the same reason.
      - name: Install dependencies
        run: npm install --workspaces --include-workspace-root

      - name: Run vitest
        working-directory: panel
        run: npx vitest run

  # ----------------------------------------------
  # 2. Change detection - only after every test job is green, and never on PRs.
  # ----------------------------------------------
  detect-changes:
    needs: [go-tests, race-tests, panel-tests, db-tests]
    if: github.event_name != 'pull_request'
    runs-on: self-hosted
    outputs:
      core: ${{ steps.filter.outputs.core }}
      node: ${{ steps.filter.outputs.node }}
      panel: ${{ steps.filter.outputs.panel }}
      log-shipper: ${{ steps.filter.outputs.log-shipper }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          # The root Dockerfile builds ALL THREE Go images (build-service.yml
          # defaults to it; only the panel passes one of its own), so a change
          # to it has to rebuild all three. It was watched by nothing: the Go
          # toolchain bump that fixed reachable standard-library CVEs reached
          # only the core image, because core/updates/feed.jsonl happened to
          # change in the same push. node and log-shipper kept shipping the old
          # toolchain with nothing to say so.
          filters: |
            core:
              - 'core/**'
              - 'proto/**'
              - 'pkg/**'
              - 'Dockerfile'
            node:
              - 'node/**'
              - 'proto/**'
              - 'pkg/**'
              - 'Dockerfile'
            panel:
              - 'panel/**'
            log-shipper:
              - 'log-shipper/**'
              - 'docker/mc-server/**'
              - 'Dockerfile'

  # ----------------------------------------------
  # 3. Build + push. Changed images on push; every image on workflow_dispatch.
  # ----------------------------------------------
  build-core:
    needs: [go-tests, race-tests, panel-tests, db-tests, detect-changes]
    if: needs.detect-changes.outputs.core == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      # Per-job Docker credential store; see the same step in
      # build-service.yml for why a shared ~/.docker/config.json on a
      # concurrent self-hosted runner produces a 403 on push.
      - name: Isolate Docker credentials for this job
        run: |
          DIR="${RUNNER_TEMP}/docker-${{ github.run_id }}-core"
          mkdir -p "$DIR"
          echo "DOCKER_CONFIG=$DIR" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core:${{ steps.tags.outputs.TAG_SHA }}
          build-args: |
            ENTRY_PATH=./core/
            SERVICE=core
            RUN_AS=dylaris

  build-node:
    needs: [go-tests, race-tests, panel-tests, db-tests, detect-changes]
    if: needs.detect-changes.outputs.node == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-service.yml
    with:
      component: node
      entry_path: ./node/
      extra_build_args: "INSTALL_QUOTA=1"
    secrets: inherit

  build-panel:
    needs: [go-tests, race-tests, panel-tests, db-tests, detect-changes]
    if: needs.detect-changes.outputs.panel == 'true' || github.event_name == 'workflow_dispatch'
    uses: ./.github/workflows/build-service.yml
    with:
      component: panel
      dockerfile: ./panel/Dockerfile
      context: .
      # No baked API URL: NEXT_PUBLIC_API_URL stays empty so the published image
      # resolves the Core API same-origin (/api) by default and never falls back
      # to a vendor host. EVERY deployment - hosted included - points the panel at
      # its Core by setting PANEL_API_URL at runtime (config.js shim), which also
      # drives the CSP connect-src. Empty PANEL_API_URL = same-origin, so a
      # self-hoster reaching the panel over localhost / a LAN IP just works.
    secrets: inherit

  build-log-shipper:
    needs: [go-tests, race-tests, panel-tests, db-tests, detect-changes]
    if: needs.detect-changes.outputs.log-shipper == 'true' || github.event_name == 'workflow_dispatch'
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      # Per-job Docker credential store; see the same step in
      # build-service.yml for why a shared ~/.docker/config.json on a
      # concurrent self-hosted runner produces a 403 on push.
      - name: Isolate Docker credentials for this job
        run: |
          DIR="${RUNNER_TEMP}/docker-${{ github.run_id }}-log-shipper"
          mkdir -p "$DIR"
          echo "DOCKER_CONFIG=$DIR" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.7'
          cache-dependency-path: log-shipper/go.sum

      - name: Build log-shipper binary
        run: |
          chmod +x ./build_shipper.sh
          ./build_shipper.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi

      # Minecraft 26.1+ refuses to start on anything below Java 25 ("Minecraft
      # 26.1 and newer requires running the server with Java 25 or above"), and
      # the version pickers offer 26.x, so without this image the newest
      # selectable version installs a server that can never boot.
      - name: Build and push java25
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java25
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java25:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java25:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java21
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java21
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java21:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java21:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java17
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java17
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java17:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java17:${{ steps.tags.outputs.TAG_SHA }}

      - name: Build and push java8
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java8
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java8:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java8:${{ steps.tags.outputs.TAG_SHA }}
