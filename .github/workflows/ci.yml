name: CI — Build & Push

on:
  push:
    branches: [main, dev]
  workflow_dispatch:
    inputs:
      build_all:
        description: 'Build all services (ignore change detection)'
        type: boolean
        default: true

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: bartis-dev/dylaris

jobs:
  detect-changes:
    runs-on: self-hosted
    outputs:
      core: ${{ steps.filter.outputs.core }}
      node: ${{ steps.filter.outputs.node }}
      panel: ${{ steps.filter.outputs.panel }}
      log-shipper: ${{ steps.filter.outputs.log-shipper }}
      beam-desktop: ${{ steps.filter.outputs.beam-desktop }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            core:
              - 'core/**'
              - 'proto/**'
              - 'pkg/**'
            node:
              - 'node/**'
              - 'proto/**'
              - 'pkg/**'
            panel:
              - 'panel/**'
            log-shipper:
              - 'log-shipper/**'
              - 'docker/mc-server/**'
            beam-desktop:
              - 'beam/**'

  # ──────────────────────────────────────────────
  # Beam desktop binaries (Wails — Linux + Windows)
  # ──────────────────────────────────────────────
  build-beam-desktop:
    needs: detect-changes
    if: needs.detect-changes.outputs.beam-desktop == 'true' || inputs.build_all == true
    runs-on: self-hosted
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: beam/app/go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install system dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-mingw-w64-x86-64 libgtk-3-dev libwebkit2gtk-4.0-dev

      - name: Install Wails CLI
        run: go install github.com/wailsapp/wails/v2/cmd/wails@v2.10.1

      - name: Build Linux binary
        working-directory: beam/app
        run: wails build -platform linux/amd64
        env:
          GOWORK: off

      - name: Build Windows binary
        working-directory: beam/app
        run: wails build -platform windows/amd64 -skipbindings
        env:
          GOWORK: off
          CC: x86_64-w64-mingw32-gcc

      - name: Collect binaries
        run: |
          mkdir -p dist-beam
          cp beam/app/build/bin/DylarisBeam dist-beam/beam-linux-amd64
          cp beam/app/build/bin/DylarisBeam.exe dist-beam/beam-windows-amd64.exe
          chmod +x dist-beam/beam-linux-amd64

      - uses: actions/upload-artifact@v4
        with:
          name: beam-binaries
          path: dist-beam/
          retention-days: 7

  # ──────────────────────────────────────────────
  # Core (depends on beam desktop binaries for embed)
  # ──────────────────────────────────────────────
  build-core:
    needs: [detect-changes, build-beam-desktop]
    if: always() && (needs.build-beam-desktop.result == 'success' || needs.build-beam-desktop.result == 'skipped') && (needs.detect-changes.outputs.core == 'true' || needs.detect-changes.outputs.beam-desktop == 'true' || inputs.build_all == true)
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download Beam binaries
        if: needs.build-beam-desktop.result == 'success'
        uses: actions/download-artifact@v4
        with:
          name: beam-binaries
          path: core/embed/binaries/

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Core
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-core:${{ steps.tags.outputs.TAG_SHA }}
          build-args: |
            ENTRY_PATH=./core/

  # ──────────────────────────────────────────────
  # Node, Panel, Log-Shipper
  # ──────────────────────────────────────────────
  build-node:
    needs: detect-changes
    if: needs.detect-changes.outputs.node == 'true' || inputs.build_all == true
    uses: ./.github/workflows/build-service.yml
    with:
      component: node
      entry_path: ./node/
      extra_build_args: "INSTALL_QUOTA=1"
    secrets: inherit

  build-panel:
    needs: detect-changes
    if: needs.detect-changes.outputs.panel == 'true' || inputs.build_all == true
    uses: ./.github/workflows/build-service.yml
    with:
      component: panel
      dockerfile: ./panel/Dockerfile
      context: .
    secrets: inherit

  build-log-shipper:
    needs: detect-changes
    if: needs.detect-changes.outputs.log-shipper == 'true' || inputs.build_all == true
    runs-on: self-hosted
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.1'
          cache-dependency-path: log-shipper/go.sum

      - name: Build log-shipper binary
        run: |
          chmod +x ./build_shipper.sh
          ./build_shipper.sh

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          SHA=$(echo "${{ github.sha }}" | cut -c1-7)
          if [ "${{ github.ref_name }}" = "main" ]; then
            echo "TAG_PRIMARY=latest" >> $GITHUB_OUTPUT
            echo "TAG_SHA=sha-${SHA}" >> $GITHUB_OUTPUT
          else
            echo "TAG_PRIMARY=dev" >> $GITHUB_OUTPUT
            echo "TAG_SHA=dev-sha-${SHA}" >> $GITHUB_OUTPUT
          fi

      - name: Build and push java21
        uses: docker/build-push-action@v5
        with:
          context: docker/mc-server
          file: docker/mc-server/Dockerfile.java21
          push: true
          tags: |
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java21:${{ steps.tags.outputs.TAG_PRIMARY }}
            ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}-mc-java21:${{ steps.tags.outputs.TAG_SHA }}
